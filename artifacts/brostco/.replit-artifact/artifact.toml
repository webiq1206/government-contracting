kind = "web"
previewPath = "/"
title = "BROSTCO — Autonomous Procurement Execution"
version = "1.0.0"
id = "artifacts/brostco"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22044

[services.development]
run = "pnpm --filter @workspace/brostco run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brostco", "run", "build" ]
publicDir = "artifacts/brostco/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22044"
BASE_PATH = "/"
