name: Fix UX typecheck

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/fix/ux-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-simplification
          fetch-depth: 0
          persist-credentials: true
      - name: Fix narrowed queue counts and summary
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          p = Path('app/(dash)/workbench/page.tsx')
          text = p.read_text()
          pattern = re.compile(r'''\s*const n =\n\s*f === "all"\n\s*\? counts\.total\n\s*: f === "overdue"\n\s*\? counts\.overdue\n\s*: f === "due_today"\n\s*\? counts\.dueToday\n\s*: f === "remaining"\n\s*\? counts\.remaining\n\s*: items\.filter\(\(i\) => stateOf\(i\) === f\)\.length;''')
          match = pattern.search(text)
          if not match:
              raise SystemExit('queue count block not found')
          indent = '              '
          new = '''\n              const n =
                f === "all"
                  ? counts.total
                  : f === "overdue"
                    ? counts.overdue
                    : items.filter((i) => stateOf(i) === f).length;'''
          text = text[:match.start()] + new + text[match.end():]
          old2 = 'summary={summarizeQueue(filteredItems)}'
          if old2 not in text:
              raise SystemExit('queue summary call not found')
          text = text.replace(old2, 'summary={`${filteredItems.length} ${filteredItems.length === 1 ? "item" : "items"}`}', 1)
          p.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-ux-typecheck.yml
          git config user.name 'BrostCo UX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix simplified work queue typecheck'
          git push origin HEAD:fix/ux-simplification
