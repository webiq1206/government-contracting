name: Fix UX typecheck

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/fix/ux-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-simplification
          fetch-depth: 0
          persist-credentials: true
      - name: Fix narrowed queue counts and summary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/(dash)/workbench/page.tsx')
          text = p.read_text()
          old = '''              const n =
                f === "all"
                  ? counts.total
                  : f === "overdue"
                    ? counts.overdue
                    : f === "due_today"
                      ? counts.dueToday
                      : f === "remaining"
                        ? counts.remaining
                        : items.filter((i) => stateOf(i) === f).length;'''
          new = '''              const n =
                f === "all"
                  ? counts.total
                  : f === "overdue"
                    ? counts.overdue
                    : items.filter((i) => stateOf(i) === f).length;'''
          if old not in text:
              raise SystemExit('queue count block not found')
          text = text.replace(old, new, 1)
          old2 = 'summary={summarizeQueue(filteredItems)}'
          new2 = 'summary={`${filteredItems.length} ${filteredItems.length === 1 ? "item" : "items"}`}'
          if old2 not in text:
              raise SystemExit('queue summary call not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-ux-typecheck.yml
          git config user.name 'BrostCo UX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix simplified work queue typecheck'
          git push origin HEAD:fix/ux-simplification
