name: Connected workflow review source
on:
  pull_request:
    paths:
      - '.github/workflows/connected-review-source.yml'
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'implementation/connected-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproduce the exact authored focused baseline
        run: |
          echo 'd59c813ef6d98daa1ecaf04f06c589f5460a550cfd9e2fa7f3d92cce4e47947a  docs/releases/focused-workspace-import.patch' | sha256sum -c -
          git apply --check --recount docs/releases/focused-workspace-import.patch
          git apply --recount docs/releases/focused-workspace-import.patch
          rm docs/releases/focused-workspace-import.patch docs/releases/focused-workspace-import.md
          git add -A
          mkdir -p "$RUNNER_TEMP/connected-review" "$RUNNER_TEMP/connected-browsers"
          git archive --format=tar.gz "$(git write-tree)" > "$RUNNER_TEMP/connected-review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/connected-review/revision.txt"
          git write-tree > "$RUNNER_TEMP/connected-review/tree.txt"
      - run: npm ci
      - name: Package the matching offline review toolchain
        run: |
          npx playwright install chromium webkit
          tar -czf "$RUNNER_TEMP/connected-review/dependencies.tar.gz" node_modules
          tar -C "$HOME/.cache" -czf "$RUNNER_TEMP/connected-browsers/browsers.tar.gz" ms-playwright
          sha256sum "$RUNNER_TEMP/connected-review/"*.tar.gz > "$RUNNER_TEMP/connected-review/checksums.txt"
          sha256sum "$RUNNER_TEMP/connected-browsers/browsers.tar.gz" > "$RUNNER_TEMP/connected-browsers/checksums.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: connected-review-source
          path: ${{ runner.temp }}/connected-review/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: connected-review-browsers
          path: ${{ runner.temp }}/connected-browsers/
          retention-days: 1
          if-no-files-found: error
