name: Redesign review source

on:
  pull_request:
    paths:
      - '.github/workflows/redesign-review-source.yml'

permissions:
  contents: read

jobs:
  source:
    if: github.head_ref == 'redesign/complete-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked review source
        run: |
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/review-source/brostco-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/review-source/tree.txt"
          sha256sum "$RUNNER_TEMP/review-source/brostco-source.tar.gz" > "$RUNNER_TEMP/review-source/checksum.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: brostco-review-source
          path: ${{ runner.temp }}/review-source/
          retention-days: 1
          if-no-files-found: error
