name: Apply final redesign

on:
  pull_request:
    paths:
      - '.github/workflows/apply-final-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'redesign/complete-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/complete-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify authored patch files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/redesign/import/01-brand.patch docs/redesign/import/02-marketing.patch docs/redesign/import/03-workflow.patch docs/redesign/import/04-tests.patch docs/redesign/import/05-gray-background.patch
          test "$(sha256sum docs/redesign/import/01-brand.patch | cut -d' ' -f1)" = "dc7a8fa78579e524a95449316f9d2be1da74fd9cd258f3058d30f6eba04ad425"
          test "$(sha256sum docs/redesign/import/02-marketing.patch | cut -d' ' -f1)" = "6f9ce04a236f85c6602347b07cc4ab4b6a1ba97a4416a13aef02c1f8058b52f2"
          test "$(sha256sum docs/redesign/import/03-workflow.patch | cut -d' ' -f1)" = "6b5d814b8a3b8e9954dd53b6063fcf0ce5961bfd739bb2fbefdafdcf5b20d35f"
          test "$(sha256sum docs/redesign/import/04-tests.patch | cut -d' ' -f1)" = "bcbe318db8c3e8e996b48b737408302a87f1cf9385d2c45d26b54917c571d732"
          test "$(sha256sum docs/redesign/import/05-gray-background.patch | cut -d' ' -f1)" = "691a322df2db211a72ae53c2f77f5a0b60c3d5551a715745395651a37cd59d0c"
      - name: Apply exact authored source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount docs/redesign/import/01-brand.patch
          git apply --recount docs/redesign/import/02-marketing.patch
          git apply --recount docs/redesign/import/03-workflow.patch
          git apply --recount docs/redesign/import/04-tests.patch
          node <<'NODE'
          const fs = require('fs');
          const edits = {
            'app/globals.css': [
              ['--background: 247 247 243;', '--background: 244 246 246;'],
              ['--muted: 238 241 237;', '--muted: 238 242 242;'],
              ['--slate-50: 247 247 243;', '--slate-50: 244 246 246;'],
              ['--slate-100: 238 241 237;', '--slate-100: 238 242 242;'],
            ],
            'app/layout.tsx': [['#F7F7F3', '#F4F6F6']],
            'components/marketing/redesign.css': [
              ['background: #f7f7f3;', 'background: #f4f6f6;'],
              ['--background: 247 247 243;', '--background: 244 246 246;'],
              ['--muted: 238 241 237;', '--muted: 238 242 242;'],
              ['#eef1ed', '#eef2f2'],
            ],
            'lib/domain/email-shell.ts': [
              ['paper: "#f7f7f3"', 'paper: "#f4f6f6"'],
              ['surfaceMuted: "#eef1ed"', 'surfaceMuted: "#eef2f2"'],
            ],
            'docs/redesign/design-system.md': [
              ['| Page | #F7F7F3 | #0B1720 |', '| Page | #F4F6F6 | #0B1720 |'],
              ['warm-neutral content, and Petrol actions', 'cool light-gray content, white cards, and Petrol actions'],
            ],
            'tests/design-system.test.ts': [['#F7F7F3', '#F4F6F6']],
          };
          for (const [file, replacements] of Object.entries(edits)) {
            let text = fs.readFileSync(file, 'utf8');
            for (const [from, to] of replacements) {
              if (!text.includes(from)) throw new Error(`${file}: missing expected text: ${from}`);
              text = text.split(from).join(to);
            }
            fs.writeFileSync(file, text);
          }
          NODE
          rm -f docs/redesign/import/01-brand.patch docs/redesign/import/02-marketing.patch docs/redesign/import/03-workflow.patch docs/redesign/import/04-tests.patch docs/redesign/import/05-gray-background.patch docs/redesign/import/README.md
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit exact validated source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-final-redesign.yml
          git config user.name 'BrostCo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize BrostCo platform redesign and cool-gray palette'
          git push origin HEAD:redesign/complete-platform
