name: Apply page simplification

on: [push]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/ux-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-simplification
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authored page simplification
        run: node scripts/apply-ux-page-simplification.mjs
      - name: Remove one-time files and commit
        run: |
          git rm .github/workflows/apply-page-simplification.yml scripts/apply-ux-page-simplification.mjs
          git config user.name 'BrostCo UX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify My Work, Opportunities, and Review'
          git push origin HEAD:fix/ux-simplification
