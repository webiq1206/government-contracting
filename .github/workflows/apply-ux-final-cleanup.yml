name: Apply final UX cleanup

on: [push]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/ux-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-simplification
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-ux-final-cleanup.mjs
      - name: Commit cleanup
        run: |
          git rm .github/workflows/apply-ux-final-cleanup.yml scripts/apply-ux-final-cleanup.mjs
          git config user.name 'BrostCo UX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify Today and Calls'
          git push origin HEAD:fix/ux-simplification
