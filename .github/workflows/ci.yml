name: CI

# Pull requests only.
#
# Validate the reviewed pull-request tree once. The repository is public and
# standard GitHub-hosted runners are free. Do not write Actions caches or
# artifacts: complete database evidence is preserved in bounded log frames
# and a source/run/attempt/hash summary instead.
# A direct main push is not validated by this workflow and is not the release path.
on:
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: node >= 22.
          node-version: 22

      # Installs from the lockfile exactly, optional dependencies included:
      # they are optional at runtime (bullmq and ioredis back the queue only
      # when REDIS_URL is set) but lib/queue/bullmq.ts still needs their types
      # to typecheck, so --omit=optional fails the next step. Playwright's
      # browser download is skipped instead, which is the part that is slow;
      # nothing here drives a browser.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      # Unit tests run without database or provider credentials. The separate
      # database job applies this exact branch's migrations to a fresh service.
      - name: Test CI evidence transport
        run: node --test .github/scripts/database-report-evidence.test.mjs

      - name: Test
        run: npm test
        env:
          BROSTCO_TEST_OFFLINE: "1"

      # Catches what tsc cannot: a client component importing server-only code,
      # a bad route export, a build-time failure in a page module.
      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brostco_audit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brostco_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      # The placeholder satisfies legacy suite discovery. config.database
      # resolves PG* only, and verifies that it differs from this endpoint.
      # No production database URL or provider secret is supplied to this job.
      DATABASE_URL: postgresql://unused@production-not-configured.invalid/unused
      USE_REPLIT_DEV_DB: "true"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: brostco_audit
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      ALLOW_TESTS_AGAINST_DATABASE_URL: "1"
      RUN_RLS_INTEGRATION: "1"
      BROSTCO_TEST_OFFLINE: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Apply and verify exact migration files
        run: |
          node --import tsx scripts/migrate.ts
          node --import tsx scripts/verify-schema.ts
          node --import tsx scripts/seed.ts
      - name: Exercise database workflows and restricted-role tenant checks
        run: >-
          node node_modules/vitest/vitest.mjs run
          integration.test.ts enqueue-provenance.test.ts opportunity-ingest.dedupe.test.ts
          --fileParallelism=false --reporter=default --reporter=json
          --outputFile=database-test-results.json
      - name: Reject a skipped or empty database gate
        run: node scripts/verify-database-test-report.mjs database-test-results.json
      - name: Preserve complete database evidence in bounded log frames
        if: always()
        run: node .github/scripts/database-report-evidence.mjs emit database-test-results.json
