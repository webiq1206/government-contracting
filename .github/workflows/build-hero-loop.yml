name: Build homepage hero loop

on:
  push:
    branches: [fix/mobile-scroll-homepage]
    paths:
      - '.github/workflows/build-hero-loop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-scroll-homepage
          fetch-depth: 0
          persist-credentials: true
      - name: Build original BrostCo product loop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i public/demos/hero-preview.mp4 \
            -i public/demos/pipeline.mp4 \
            -i public/demos/opportunity.mp4 \
            -i public/demos/activity.mp4 \
            -filter_complex "[0:v]trim=duration=4,setpts=PTS-STARTPTS,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24[v0];[1:v]trim=duration=4,setpts=PTS-STARTPTS,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24[v1];[2:v]trim=duration=4,setpts=PTS-STARTPTS,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24[v2];[3:v]trim=duration=4,setpts=PTS-STARTPTS,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24[v3];[v0][v1]xfade=transition=fade:duration=.55:offset=3.45[x1];[x1][v2]xfade=transition=fade:duration=.55:offset=6.9[x2];[x2][v3]xfade=transition=fade:duration=.55:offset=10.35,format=yuv420p[out]" \
            -map "[out]" -an -c:v libx264 -preset veryfast -crf 29 -movflags +faststart public/demos/hero-loop.mp4
          test -s public/demos/hero-loop.mp4
          ls -lh public/demos/hero-loop.mp4
      - name: Commit video asset
        run: |
          git rm .github/workflows/build-hero-loop.yml
          git config user.name 'BrostCo Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/demos/hero-loop.mp4
          git commit -m 'Add optimized BrostCo homepage hero video'
          git push origin HEAD:fix/mobile-scroll-homepage
